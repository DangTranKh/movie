  <div id="movieList">
    <!-- Cac card phim duoc inject boi renderList() -->
  </div>
</aside>

<!-- ===========================================================
     PANEL PHAI: TRINH PHAT VIDEO
     =========================================================== -->
<main id="playerPanel">

  <!-- Vung video / iframe -->
  <div id="videoWrap">
    <!-- Man hinh cho (placeholder) -->
    <div id="placeholder">
      <div class="ph-ring">&#9654;</div>
      <div class="ph-text">
        <h2>Chao mung den CinemaX</h2>
        <p>Chon mot bo phim de bat dau xem</p>

    <!--
      iFrame Player:
      - src duoc thay doi bang JS khi click tap phim

      - Hoat dong tren moi trinh duyet (ke ca TV cu)
    -->
    <iframe
      id="iframePlayer"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      scrolling="no"
      frameborder="0"
      allow="autoplay; fullscreen"
      referrerpolicy="no-referrer"
      style="width: 100%; height: 100%; border: none; display: none;"
    ></iframe>
  </div>

  <!-- Panel thong tin phim & danh sach tap -->
  <div id="infoPanel">

    <!-- Chua chon phim -->
    <div id="infoPlaceholder">

      <p>Chua co phim nao duoc chon</p>
      <small>Nhan phim mui ten va OK tren Remote de chon phim</small>
    </div>

    <!-- Da chon phim (an ban dau, hien sau khi chon) -->
    <div id="movieDetail">
      <div id="nowPlayingBar">
        <div>
          <div id="npTitle"></div>
          <div id="npEpisode"></div>
        </div>
        <div class="live-pill">
          <div class="live-dot"></div>
          DANG PHAT
        </div>
      </div>

      <div class="eps-head">
        <span class="eps-label">&#128203; Danh sach tap</span>
        <span id="epCount"></span>
      </div>

      <!-- Luoi cac nut tap - dung inline-block, KHONG dung CSS Grid -->
      <div id="episodeGrid">
        <!-- Cac nut tap duoc inject boi renderEpisodes() -->
      </div>
    </div>

  </div><!-- /infoPanel -->

</main><!-- /playerPanel -->

<!-- ===========================================================
     THANH DIEU HUONG REMOTE (duoi cung)
     =========================================================== -->
<div id="navBar">
  <span class="nav-item"><span class="nav-key">&#8593;&#8595;</span>Chon phim</span>
  <span class="nav-item"><span class="nav-key">OK</span>Phat / Chon</span>

</div>

<!-- Toast thong bao -->
<div id="toast"></div>


<!-- ===========================================================
     JAVASCRIPT - CHUAN ES5 THUAN TUY
     Khong dung: const, let, arrow function, template literal,
                 destructuring, spread operator, CSS Grid
     =========================================================== -->
<script>

  /* ===========================================================
     ██████████████████████████████████████████████████████
     ██  DANH SACH SLUG PHIM CA NHAN - CHINH SUA O DAY  ██
     ██████████████████████████████████████████████████████

     Them slug cua phim ban muon xem vao mang nay.
     Slug la phan cuoi cua URL phim tren NguonC, vi du:
       https://phim.nguonc.com/phim/keo-ngot-tinh-yeu
       => slug la: "keo-ngot-tinh-yeu"

     Ung dung se tu dong goi API:
       https://phim.nguonc.com/api/film/{slug}
     va hien thi phim do len sidebar.
     =========================================================== */
  var MY_FAVORITE_SLUGS = [
    "keo-ngot-tinh-yeu",
    "doraemon-nobita-va-nuoc-nhat-thoi-nguyen-thuy-remake",
    "phi-vu-chung-cu",
    "tai-phiet-va-canh-sat-phan-2",
    "chuyen-tinh-ma-quai",
    "tai"
    /* Dan them slug cua phim khac vao day, cach nhau bang dau phay:
       ,"ten-phim-khac"
       ,"ten-phim-thu-3"
    */
  ];

  /* ===========================================================
     MANG PHIM DUOC LOAD DONG TU API
     Khong chinh sua tay - duoc populate boi fetchAllMovies()
     =========================================================== */
  var MY_MOVIES = [];

  /* ===========================================================
     TRANG THAI UNG DUNG (Application State)
     Theo doi trang thai hien tai cua ung dung
     =========================================================== */
  var state = {
    activeMovieIndex: -1,   /* Index phim dang chon trong MY_MOVIES */
    activeEpIndex: -1,      /* Index tap dang phat */
    searchQuery: '',        /* Tu khoa tim kiem hien tai */
    filteredList: [],       /* Mang phan tu {movie, origIndex} sau loc */
    loadedCount: 0,         /* So slug da fetch xong (thanh cong + that bai) */
    totalSlugs: 0           /* Tong so slug can fetch */
  };

  /* ===========================================================
     TRANG THAI DIEU HUONG REMOTE TV (TV Remote Navigation State)
     Quan ly vi tri focus hien tai khi nguoi dung bam phim mui ten
     =========================================================== */
  var nav = {
    zone: 'list',       /* 'list' = dang o danh sach phim, 'episodes' = dang o tap phim */
    listFocusIdx: 0,    /* Index card dang focus trong filteredList */
    epFocusIdx: 0       /* Index nut tap dang focus */
  };

  /* ===========================================================
     THAM CHIEU DOM - Lay mot lan, tai su dung nhieu lan
     Tranh goi getElementById nhieu lan lam cham TV cu
     =========================================================== */
  var DOM = {
    header:        document.getElementById('header'),
    sidebar:       document.getElementById('sidebar'),
    playerPanel:   document.getElementById('playerPanel'),
    videoWrap:     document.getElementById('videoWrap'),
    iframePlayer:  document.getElementById('iframePlayer'),
    placeholder:   document.getElementById('placeholder'),
    infoPanel:     document.getElementById('infoPanel'),
    infoPlaceholder: document.getElementById('infoPlaceholder'),
    movieDetail:   document.getElementById('movieDetail'),
    movieList:     document.getElementById('movieList'),
    sbTitle:       document.getElementById('sbTitle'),
    listCount:     document.getElementById('listCount'),
    npTitle:       document.getElementById('npTitle'),
    npEpisode:     document.getElementById('npEpisode'),
    episodeGrid:   document.getElementById('episodeGrid'),
    epCount:       document.getElementById('epCount'),
    searchInput:   document.getElementById('searchInput'),
    btnClear:      document.getElementById('btnClear'),
    tvZoneLabel:   document.getElementById('tvZoneLabel'),
    toast:         document.getElementById('toast')
  };

  /* ===========================================================
     CAC HAM TIEN ICH (Utility Functions)
     Viet theo ES5, thay the classList de tuong thich TV cu
     =========================================================== */

  /**
   * Kiem tra phan tu co class cu the khong.
   * An toan hon classList.contains tren trinh duyet cu.
   */
  function hasClass(el, cls) {
    return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') !== -1;
  }

  /**
   * Them class vao phan tu (neu chua co).
   */
  function addClass(el, cls) {
    if (!hasClass(el, cls)) {
      el.className = el.className ? (el.className + ' ' + cls) : cls;
    }
  }

  /**
   * Xoa class khoi phan tu.
   * Dung RegExp de xu ly ca khoang trang xung quanh.
   */
  function removeClass(el, cls) {
    el.className = (' ' + el.className + ' ')
      .replace(new RegExp(' ' + cls + ' ', 'g'), ' ')
      .replace(/^\s+|\s+$/g, '');
  }

  /**
   * Hien thi toast thong bao ngan.
   * @param {string} msg      - Noi dung can hien
   * @param {number} duration - Thoi gian hien (ms), mac dinh 2800
   */
  function showToast(msg, duration) {
    if (!duration) duration = 2800;
    DOM.toast.textContent = msg;
    addClass(DOM.toast, 'show');
    clearTimeout(DOM.toast._t);
    DOM.toast._t = setTimeout(function() {
      removeClass(DOM.toast, 'show');
    }, duration);
  }

  /**
   * Cap nhat label vung dieu huong hien thi o header.
   * @param {string} zone - 'list' hoac 'episodes'
   */
  function updateZoneLabel(zone) {
    var el = DOM.tvZoneLabel;
    if (zone === 'list') {
      el.textContent = '\u{1F3AE} Danh sach phim';
      el.className = 'zone-list';
    } else {
      el.textContent = '\u{1F3AC} Chon tap phim';
      el.className = 'zone-episodes';
    }
  }

  /* ===========================================================
     TINH TOAN LAYOUT BANG JS
     Tuong thich voi TV khong ho tro CSS calc() hay aspect-ratio
     Duoc goi khi trang tai va khi thay doi kich thuoc
     =========================================================== */
  function setLayout() {
    var panelW = DOM.playerPanel.offsetWidth;
    var panelH = DOM.playerPanel.offsetHeight;

    /* Tinh chieu cao video theo ty le 16:9 */
    var videoH = Math.round(panelW * 9 / 16);

    /* Gioi han: toi da 60% chieu cao panel de con cho danh sach tap */
    var maxVideoH = Math.round(panelH * 0.60);
    if (videoH > maxVideoH) videoH = maxVideoH;

    /* Chieu cao toi thieu cho vung video */
    if (videoH < 120) videoH = 120;

    /* Ap dung chieu cao cho videoWrap */
    DOM.videoWrap.style.height = videoH + 'px';

    /* infoPanel bat dau ngay duoi videoWrap */
    DOM.infoPanel.style.top = videoH + 'px';
  }

  /* ===========================================================
     RENDER DANH SACH PHIM VAO SIDEBAR
     Loc theo tu khoa roi ve cac card phim
     @param {string} query - Tu khoa tim kiem (da lowercase)
     =========================================================== */
  function renderList(query) {
    var i, m, item, html, thumbHTML, metaHTML, epCnt, isActive;

    /* Tao lai filteredList: loc MY_MOVIES theo query */
    state.filteredList = [];
    for (i = 0; i < MY_MOVIES.length; i++) {
      m = MY_MOVIES[i];
      if (!query) {
        state.filteredList.push({ movie: m, origIndex: i });
      } else {
        var haystack = ((m.name || '') + ' ' + (m.origin_name || '')).toLowerCase();
        if (haystack.indexOf(query) !== -1) {
          state.filteredList.push({ movie: m, origIndex: i });
        }
      }
    }

    /* Cap nhat tieu de sidebar */
    if (query) {
      DOM.sbTitle.textContent = 'Ket qua: ' + query;
    } else {
      DOM.sbTitle.textContent = 'Danh sach phim';
    }
    DOM.listCount.textContent = state.filteredList.length + ' phim';

    /* Truong hop danh sach MY_MOVIES trong */
    if (MY_MOVIES.length === 0) {
      DOM.movieList.innerHTML =
        '<div class="state-box">' +
          '<div class="emo">&#128194;</div>' +
          '<div class="ttl">Chua co phim nao</div>' +
          '<div class="sub">Mo file va them phim vao bien MY_MOVIES trong the &lt;script&gt;</div>' +
        '</div>';
      return;
    }

    /* Truong hop tim kiem khong co ket qua */
    if (state.filteredList.length === 0) {
      DOM.movieList.innerHTML =
        '<div class="state-box">' +
          '<div class="emo">&#128269;</div>' +
          '<div class="ttl">Khong tim thay phim</div>' +
          '<div class="sub">Thu tim voi tu khoa khac</div>' +
        '</div>';
      return;
    }

    /* Ve cac card phim bang cong chuoi (KHONG dung template literal) */
    html = '';
    for (i = 0; i < state.filteredList.length; i++) {
      item = state.filteredList[i];
      m = item.movie;
      epCnt = (m.episodes && m.episodes.length) ? m.episodes.length : 0;
      isActive = (item.origIndex === state.activeMovieIndex);

      /* Thumbnail: dung anh neu co, fallback emoji */
      if (m.thumb_url && m.thumb_url !== '') {
        thumbHTML =
          '<img class="card-thumb" src="' + m.thumb_url + '" alt="" ' +
          'onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\';" />' +
          '<div class="thumb-placeholder" style="display:none;">&#127916;</div>';
      } else {
        thumbHTML = '<div class="thumb-placeholder">&#127916;</div>';
      }

      /* Badge nam va so tap */
      metaHTML = '';
      if (m.year) metaHTML += '<span class="badge b-year">' + m.year + '</span>';
      if (epCnt > 0) metaHTML += '<span class="badge b-eps">' + epCnt + ' tap</span>';

      /* Tao HTML card */
      html +=
        '<div class="movie-card' + (isActive ? ' active' : '') + '" ' +
          'id="card-' + i + '" ' +
          'data-orig="' + item.origIndex + '" ' +
          'data-listidx="' + i + '" ' +
          'onclick="onCardClick(' + item.origIndex + ', ' + i + ')">' +
          thumbHTML +
          '<div class="card-body">' +
            '<div class="card-name">' + (m.name || 'Khong ro ten') + '</div>' +
            (m.origin_name ? '<div class="card-origin">' + m.origin_name + '</div>' : '') +
            '<div class="card-meta">' + metaHTML + '</div>' +
          '</div>' +
        '</div>';
    }

    DOM.movieList.innerHTML = html;

    /* Dam bao nav.listFocusIdx nam trong gioi han sau khi re-render */
    if (nav.listFocusIdx >= state.filteredList.length) {
      nav.listFocusIdx = 0;
    }

    /* Ap dung focus neu dang o zone 'list' */
    if (nav.zone === 'list' && state.filteredList.length > 0) {
      applyListFocus(nav.listFocusIdx, false);
    }
  }

  /* ===========================================================
     RENDER CAC NUT TAP PHIM
     Dung inline-block, KHONG dung CSS Grid
     @param {Array} episodes - Mang tap phim tu MY_MOVIES[x].episodes
     =========================================================== */
  function renderEpisodes(episodes) {
    var i, ep, html;

    if (!episodes) episodes = [];
    DOM.epCount.textContent = episodes.length + ' tap';

    if (episodes.length === 0) {
      DOM.episodeGrid.innerHTML = '<span style="color:#737373;font-size:13px;">Phim nay chua co tap nao.</span>';
      return;
    }

    html = '';
    for (i = 0; i < episodes.length; i++) {
      ep = episodes[i];
      html +=
        '<button class="ep-btn" ' +
          'id="ep-' + i + '" ' +
          'onclick="onEpClick(' + i + ')">' +
          (ep.name || ('Tap ' + (i + 1))) +
        '</button>';
    }

    DOM.episodeGrid.innerHTML = html;
  }

  /* ===========================================================
     XU LY CLICK CHON BO PHIM
     Duoc goi khi: click chuot vao card HOAC nhan OK tren Remote
     @param {number} origIndex - Index trong MY_MOVIES
     @param {number} listIdx   - Index hien tai trong filteredList
     =========================================================== */
  function onCardClick(origIndex, listIdx) {
    var movie, cards, i, episodes;

    /* Neu da chon phim nay roi thi bo qua */
    if (origIndex === state.activeMovieIndex) return;

    state.activeMovieIndex = origIndex;
    state.activeEpIndex = -1;

    /* Cap nhat class 'active' cho cac card */
    cards = DOM.movieList.querySelectorAll('.movie-card');
    for (i = 0; i < cards.length; i++) {
      removeClass(cards[i], 'active');
      if (parseInt(cards[i].getAttribute('data-orig'), 10) === origIndex) {
        addClass(cards[i], 'active');
      }
    }

    movie = MY_MOVIES[origIndex];
    if (!movie) return;

    /* Hien thi thong tin phim */
    DOM.npTitle.textContent = movie.name || 'Khong ro ten';
    DOM.npEpisode.textContent = '';
    DOM.infoPlaceholder.style.display = 'none';
    DOM.movieDetail.style.display = 'block';

    /* Ve danh sach tap */
    episodes = movie.episodes || [];
    renderEpisodes(episodes);

    /* Cap nhat nav focus */
    nav.listFocusIdx = (typeof listIdx === 'number') ? listIdx : nav.listFocusIdx;

    /* Tu dong phat tap dau tien neu co */
    if (episodes.length > 0) {
      nav.epFocusIdx = 0;
      onEpClick(0);
    } else {
      showToast('Phim nay chua co tap phim!');
    }
  }

  /* ===========================================================
     XU LY CLICK CHON TAP PHIM
     Duoc goi khi: click chuot vao nut tap HOAC nhan OK tren Remote
     @param {number} epIndex - Index tap trong MY_MOVIES[x].episodes
     =========================================================== */
  function onEpClick(epIndex) {
    var movie, ep, btns, i, activeBtn;

    if (state.activeMovieIndex === -1) {
      showToast('Vui long chon bo phim truoc!');
      return;
    }

    movie = MY_MOVIES[state.activeMovieIndex];
    if (!movie || !movie.episodes || !movie.episodes[epIndex]) {
      showToast('Khong tim thay tap phim nay!');
      return;
    }

    ep = movie.episodes[epIndex];

    /* Kiem tra link embed */
    if (!ep.link_embed || ep.link_embed === '') {
      showToast('Tap nay chua co link phat! Hay dan link_embed vao MY_MOVIES.');
      return;
    }

    state.activeEpIndex = epIndex;
    nav.epFocusIdx = epIndex;

    /* Cap nhat class 'active' va 'tv-focus' cho cac nut tap */
    btns = DOM.episodeGrid.querySelectorAll('.ep-btn');
    for (i = 0; i < btns.length; i++) {
      removeClass(btns[i], 'active');
      removeClass(btns[i], 'tv-focus');
    }

    activeBtn = document.getElementById('ep-' + epIndex);
    if (activeBtn) {
      addClass(activeBtn, 'active');
      /* Chi them tv-focus neu dang o zone episodes */
      if (nav.zone === 'episodes') {
        addClass(activeBtn, 'tv-focus');
      }
    }

    /* Cap nhat thong tin dang phat */
    DOM.npEpisode.textContent = 'Dang phat: ' + (ep.name || ('Tap ' + (epIndex + 1)));

    /*
      QUAN TRONG: Dat src cho iframe.
      Trinh duyet tu dong tai trang phim trong iframe.
      Khong can HLS.js, khong can CORS proxy, hoat dong tren moi TV.
    */
    DOM.iframePlayer.src = ep.link_embed;
    DOM.iframePlayer.style.display = 'block';
    DOM.placeholder.style.display = 'none';

    /* Cuon infoPanel ve dau */
    DOM.infoPanel.scrollTop = 0;
  }

  /* ===========================================================
     HE THONG DIEU HUONG REMOTE TV
     Xu ly phim mui ten va cac nut dac biet tren Remote

     Ma phim chuan:
       37 = Trai (Left)    38 = Len (Up)
       39 = Phai (Right)   40 = Xuong (Down)
       13 = OK / Enter
        8 = Back (trinh duyet)
      461 = Back (LG webOS)
    10009 = Back (Samsung Tizen)
     =========================================================== */

  /**
   * Ap dung highlight focus TV vao card phim trong danh sach.
   * Dong thoi tu dong cuon sidebar de card hien thi trong tam nhin.
   * @param {number} idx      - Index card trong filteredList
   * @param {boolean} doScroll - Co cuon sidebar khong? (mac dinh: true)
   */
  function applyListFocus(idx, doScroll) {
    var cards, targetCard, sidebar, cardTop, cardH, sTop, sH;

    if (doScroll === undefined) doScroll = true;

    /* Xoa focus cu khoi tat ca card */
    cards = DOM.movieList.querySelectorAll('.movie-card');
    for (var i = 0; i < cards.length; i++) {
      removeClass(cards[i], 'tv-focus');
    }

    /* Ap dung focus moi */
    targetCard = document.getElementById('card-' + idx);
    if (!targetCard) return;

    addClass(targetCard, 'tv-focus');
    nav.listFocusIdx = idx;

    /* Cuon sidebar de card focus nam trong tam nhin */
    if (doScroll) {
      sidebar = DOM.sidebar;
      cardTop = targetCard.offsetTop;
      cardH   = targetCard.offsetHeight;
      sTop    = sidebar.scrollTop;
      sH      = sidebar.offsetHeight;

      if (cardTop < sTop + 10) {
        sidebar.scrollTop = cardTop - 10;
      } else if (cardTop + cardH > sTop + sH - 10) {
        sidebar.scrollTop = cardTop + cardH - sH + 10;
      }
    }
  }

  /**
   * Ap dung highlight focus TV vao nut tap phim.
   * Dong thoi cuon infoPanel de nut hien thi trong tam nhin.
   * @param {number} idx - Index nut tap
   */
  function applyEpFocus(idx) {
    var btns, targetBtn, panel, btnTop, btnH, sTop, sH;

    /* Xoa focus cu */
    btns = DOM.episodeGrid.querySelectorAll('.ep-btn');
    for (var i = 0; i < btns.length; i++) {
      removeClass(btns[i], 'tv-focus');
    }

    /* Ap dung focus moi */
    targetBtn = document.getElementById('ep-' + idx);
    if (!targetBtn) return;

    addClass(targetBtn, 'tv-focus');
    nav.epFocusIdx = idx;

    /* Cuon infoPanel de nut focus hien thi */
    panel  = DOM.infoPanel;
    btnTop = targetBtn.offsetTop;
    btnH   = targetBtn.offsetHeight;
    sTop   = panel.scrollTop;
    sH     = panel.offsetHeight;

    if (btnTop < sTop + 5) {
      panel.scrollTop = btnTop - 5;
    } else if (btnTop + btnH > sTop + sH - 5) {
      panel.scrollTop = btnTop + btnH - sH + 5;
    }
  }

  /**
   * Ham chinh xu ly phim bam tren Remote TV.
   * Duoc dang ky vao document.onkeydown.
   */
  function onKeyDown(e) {
    var key = e.keyCode || e.which;
    var listLen = state.filteredList.length;
    var item, movie, episodes, epLen, newIdx, cards, btns, i;

    /* Xac dinh loai phim bam */
    var isEnter = (key === 13);
    var isUp    = (key === 38);
    var isDown  = (key === 40);
    var isLeft  = (key === 37);
    var isRight = (key === 39);
    var isBack  = (key === 8 || key === 461 || key === 10009 || key === 27);

    /* Bo qua neu dang focus vao o tim kiem
       Nut Escape / Back se thoat khoi o tim kiem */
    if (document.activeElement === DOM.searchInput) {
      if (isBack) {
        DOM.searchInput.blur();
        if (nav.zone === 'list' && listLen > 0) {
          applyListFocus(nav.listFocusIdx);
        }
      }
      return; /* De input xu ly cac phim con lai */
    }

    /* Neu khong phai phim dieu huong thi bo qua */
    if (!isEnter && !isUp && !isDown && !isLeft && !isRight && !isBack) return;

    /* Ngan trinh duyet tu dong scroll trang */
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();

    /* ========================================================
       DIEU HUONG TRONG VUNG DANH SACH PHIM (zone = 'list')
       ======================================================== */
    if (nav.zone === 'list') {

      if (isUp) {
        if (listLen === 0) return;
        newIdx = nav.listFocusIdx - 1;
        if (newIdx < 0) newIdx = 0;
        applyListFocus(newIdx);

      } else if (isDown) {
        if (listLen === 0) return;
        newIdx = nav.listFocusIdx + 1;
        if (newIdx >= listLen) newIdx = listLen - 1;
        applyListFocus(newIdx);

      } else if (isRight) {
        /* Chuyen sang zone episodes neu phim da duoc chon va co tap */
        if (state.activeMovieIndex !== -1) {
          movie = MY_MOVIES[state.activeMovieIndex];
          if (movie && movie.episodes && movie.episodes.length > 0) {
            nav.zone = 'episodes';
            updateZoneLabel('episodes');

            /* Xoa focus khoi danh sach */
            cards = DOM.movieList.querySelectorAll('.movie-card');
            for (i = 0; i < cards.length; i++) { removeClass(cards[i], 'tv-focus'); }

            applyEpFocus(nav.epFocusIdx);
            showToast('Chon tap phim - Nhan OK de phat', 2000);
          } else {
            showToast('Phim nay chua co tap phim');
          }
        } else {
          showToast('Hay chon mot bo phim truoc (nhan OK)');
        }

      } else if (isEnter) {
        /* Chon phim dang focus */
        if (listLen === 0) return;
        item = state.filteredList[nav.listFocusIdx];
        if (!item) return;
        onCardClick(item.origIndex, nav.listFocusIdx);

        /* Sau khi chon phim, tu dong chuyen sang zone episodes */
        movie = MY_MOVIES[item.origIndex];
        if (movie && movie.episodes && movie.episodes.length > 0) {
          nav.zone = 'episodes';
          updateZoneLabel('episodes');

          cards = DOM.movieList.querySelectorAll('.movie-card');
          for (i = 0; i < cards.length; i++) { removeClass(cards[i], 'tv-focus'); }

          /* Dat timeout ngan de cho DOM cap nhat xong (renderEpisodes) */
          setTimeout(function() {
            nav.epFocusIdx = 0;
            applyEpFocus(0);
          }, 60);
        }
      }
      /* Left va Back o zone 'list' khong lam gi */
    }

    /* ========================================================
       DIEU HUONG TRONG VUNG TAP PHIM (zone = 'episodes')
       ======================================================== */
    else if (nav.zone === 'episodes') {

      movie = (state.activeMovieIndex !== -1) ? MY_MOVIES[state.activeMovieIndex] : null;
      episodes = (movie && movie.episodes) ? movie.episodes : [];
      epLen = episodes.length;

      if (isLeft || isUp) {
        if (nav.epFocusIdx > 0) {
          /* Di chuyen sang tap truoc */
          applyEpFocus(nav.epFocusIdx - 1);
        } else {
          /* Da o tap dau tien: quay ve danh sach phim */
          nav.zone = 'list';
          updateZoneLabel('list');

          btns = DOM.episodeGrid.querySelectorAll('.ep-btn');
          for (i = 0; i < btns.length; i++) { removeClass(btns[i], 'tv-focus'); }

          applyListFocus(nav.listFocusIdx);
          showToast('Quay lai danh sach phim', 1800);
        }

      } else if (isRight || isDown) {
        if (nav.epFocusIdx < epLen - 1) {
          /* Di chuyen sang tap sau */
          applyEpFocus(nav.epFocusIdx + 1);
        }

      } else if (isEnter) {
        /* Phat tap dang focus */
        onEpClick(nav.epFocusIdx);

      } else if (isBack) {
        /* Phim Back: quay ve danh sach phim */
        nav.zone = 'list';
        updateZoneLabel('list');

        btns = DOM.episodeGrid.querySelectorAll('.ep-btn');
        for (i = 0; i < btns.length; i++) { removeClass(btns[i], 'tv-focus'); }

        applyListFocus(nav.listFocusIdx);
        showToast('Quay lai danh sach phim', 1800);
      }
    }
  }

  /* ===========================================================
     TIM KIEM - LOC DANH SACH CLIENT-SIDE
     Khong goi API, loc truc tiep tren MY_MOVIES
     =========================================================== */
  var _searchTimer = null;

  function onSearchInput() {
    var val = DOM.searchInput.value || '';
    DOM.btnClear.style.display = val ? 'block' : 'none';

    /* Debounce 280ms de khong render lien tuc khi go nhanh */
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(function() {
      state.searchQuery = val.toLowerCase ? val.toLowerCase() : val;
      nav.listFocusIdx = 0;
      renderList(state.searchQuery);
    }, 280);
  }

  function clearSearch() {
    DOM.searchInput.value = '';
    DOM.btnClear.style.display = 'none';
    state.searchQuery = '';
    nav.listFocusIdx = 0;
    renderList('');
    DOM.searchInput.blur();
  }

  /* ===========================================================
     FETCH DU LIEU PHIM TU API NGUONC
     Su dung XMLHttpRequest ES5 - KHONG dung fetch() / Promise
     Moi slug duoc goi trong mot request rieng biet.
     Sau khi tat ca hoan thanh (thanh cong hoac that bai),
     mang MY_MOVIES se duoc sap xep lai va render.
     =========================================================== */

  /**
   * Hien thi trang thai dang tai trong sidebar.
   * @param {number} loaded - So phim da tai xong
   * @param {number} total  - Tong so phim can tai
   */
  function showLoadingState(loaded, total) {
    DOM.sbTitle.textContent = 'Dang tai danh sach...';
    DOM.listCount.textContent = loaded + '/' + total;
    DOM.movieList.innerHTML =
      '<div class="state-box">' +
        '<div class="emo">&#9654;</div>' +
        '<div class="ttl">Dang tai phim...</div>' +
        '<div class="sub">Dang lay du lieu tu NguonC (' + loaded + '/' + total + ' phim)</div>' +
      '</div>';
  }

  /**
   * Goi API lay thong tin mot phim theo slug.
   * Dung XMLHttpRequest de tuong thich ES5 / TV cu.
   * @param {string}   slug     - Slug phim tren NguonC
   * @param {number}   slugIdx  - Vi tri slug trong MY_FAVORITE_SLUGS (de giu thu tu)
   * @param {Function} callback - Ham goi lai khi hoan thanh: callback(movieObj hoac null)
   */
  function fetchOneFilm(slug, slugIdx, callback) {
    var xhr, url;
    url = 'https://phim.nguonc.com/api/film/' + slug;

    if (window.XMLHttpRequest) {
      xhr = new XMLHttpRequest();
    } else {
      callback(null, slugIdx);
      return;
    }

    xhr.onreadystatechange = function() {
      var data, film, episodes, serverList, s, items, i, ep, serverName, epTitle;
      if (xhr.readyState !== 4) return;

      if (xhr.status === 200) {
        try {
          data = JSON.parse(xhr.responseText);

          film = data.movie || data.film || {};
          episodes = [];

          // SỬA Ở ĐÂY: Duyệt qua TOÀN BỘ các Server (Vietsub, Lồng Tiếng,...)
          if (film.episodes && film.episodes.length > 0) {
            serverList = film.episodes;
            
            for (s = 0; s < serverList.length; s++) {
              serverName = serverList[s].server_name || ('Server ' + (s + 1));
              items = serverList[s].items || [];

              for (i = 0; i < items.length; i++) {
                ep = items[i];
                // Nếu phim có từ 2 Server trở lên (Vietsub + Lồng Tiếng), gắn thêm tên Server vào nút bấm
                if (serverList.length > 1) {
                  epTitle = 'Tập ' + ep.name + ' (' + serverName + ')';
                } else {
                  epTitle = 'Tập ' + ep.name;
                }

                episodes.push({
                  name:       epTitle,
                  link_embed: ep.embed || ep.link_embed || ''
                });
              }
            }
          }

          callback({
            name:        film.name          || slug,
            origin_name: film.original_name || film.origin_name || '',
            year:        film.year          ? String(film.year) : '',
            thumb_url:   film.poster_url    || film.thumb_url   || '',
            slug:        slug,
            episodes:    episodes
          }, slugIdx);

        } catch (parseErr) {
          callback(null, slugIdx);
        }
      } else {
        callback(null, slugIdx);
      }
    };

    xhr.onerror = function() { callback(null, slugIdx); };
    xhr.timeout = 15000;
    xhr.ontimeout = function() { callback(null, slugIdx); };

    xhr.open('GET', url, true);
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.send();
  }

  /**
   * Duyet qua tat ca slug trong MY_FAVORITE_SLUGS,
   * goi API song song, gom ket qua va render khi xong.
   */
  function fetchAllMovies() {
    var i, total;
    total = MY_FAVORITE_SLUGS.length;

    /* Kiem tra neu danh sach slug trong */
    if (total === 0) {
      MY_MOVIES = [];
      renderList('');
      showToast('Chua co slug nao trong MY_FAVORITE_SLUGS!', 4000);
      return;
    }

    /* Khoi tao mang ket qua giu thu tu theo slugIdx */
    var results = [];
    for (i = 0; i < total; i++) results[i] = null;

    state.totalSlugs  = total;
    state.loadedCount = 0;
    showLoadingState(0, total);

    /* Ham xu ly khi moi fetch hoan thanh (thanh cong hoac that bai) */
    function onOneFetchDone(movieObj, slugIdx) {
      state.loadedCount += 1;

      if (movieObj !== null) {
        results[slugIdx] = movieObj;
      }

      /* Cap nhat trang thai dang tai */
      showLoadingState(state.loadedCount, total);

      /* Khi tat ca slug da xong */
      if (state.loadedCount === total) {
        /* Gom cac phim thanh cong (loai bo null), giu thu tu slug goc */
        MY_MOVIES = [];
        for (var j = 0; j < results.length; j++) {
          if (results[j] !== null) {
            MY_MOVIES.push(results[j]);
          }
        }

        /* Render danh sach */
        renderList(state.searchQuery);

        /* Ap dung focus ban dau */
        setTimeout(function() {
          if (state.filteredList.length > 0) {
            applyListFocus(0);
          }
          updateZoneLabel('list');
        }, 120);

        /* Thong bao ket qua */
        var okCount = MY_MOVIES.length;
        var failCount = total - okCount;
        if (okCount > 0 && failCount === 0) {
          showToast('Da tai ' + okCount + ' phim thanh cong!', 2500);
        } else if (okCount > 0 && failCount > 0) {
          showToast('Da tai ' + okCount + '/' + total + ' phim. ' + failCount + ' phim loi.', 3500);
        } else {
          showToast('Khong the tai phim. Kiem tra ket noi mang!', 4000);
        }

        if (window.console && console.log) {
          console.log('CinemaX: Hoan thanh fetch. ' + okCount + '/' + total + ' phim OK.');
        }
      }
    }

    /* Bat dau fetch song song tat ca slug */
    for (i = 0; i < total; i++) {
      /* Dung IIFE de dong bang bien slug va slugIdx trong vong lap ES5 */
      (function(slug, idx) {
        fetchOneFilm(slug, idx, onOneFetchDone);
      }(MY_FAVORITE_SLUGS[i], i));
    }
  }

  /* ===========================================================
     KHOI TAO UNG DUNG
     Duoc goi mot lan khi DOMContentLoaded
     =========================================================== */
  function init() {
    /* 1. Tinh toan va dat layout bang JS */
    setLayout();
    window.onresize = setLayout; /* TV hiem khi resize nhung cu the */

    /* 2. Dang ky su kien cho thanh tim kiem */
    if (DOM.searchInput.addEventListener) {
      DOM.searchInput.addEventListener('input', onSearchInput, false);
      DOM.searchInput.addEventListener('focus', function() {
        /* Khi vao o tim kiem: xoa focus TV khoi cac phan tu khac */
        var cards = DOM.movieList.querySelectorAll('.movie-card');
        for (var i = 0; i < cards.length; i++) { removeClass(cards[i], 'tv-focus'); }
        var btns = DOM.episodeGrid.querySelectorAll('.ep-btn');
        for (var j = 0; j < btns.length; j++) { removeClass(btns[j], 'tv-focus'); }
      }, false);
    } else {
      /* Fallback cho trinh duyet rat cu (IE8 kieu cu) */
      DOM.searchInput.onkeyup = onSearchInput;
    }

    if (DOM.btnClear.addEventListener) {
      DOM.btnClear.addEventListener('click', clearSearch, false);
    } else {
      DOM.btnClear.onclick = clearSearch;
    }

    /* 3. Dang ky xu ly phim Remote TV */
    if (document.addEventListener) {
      document.addEventListener('keydown', onKeyDown, false);
    } else if (document.attachEvent) {
      /* Fallback cho trinh duyet rat cu */
      document.attachEvent('onkeydown', onKeyDown);
    }

    /* 4. Dang ky phim dac biet cho Samsung Tizen */
    try {
      if (window.tizen && window.tizen.tvinputdevice) {
        window.tizen.tvinputdevice.registerKey('ColorF0Red');
        window.tizen.tvinputdevice.registerKey('ColorF1Green');
        window.tizen.tvinputdevice.registerKey('MediaPlayPause');
      }
    } catch (err) {
      /* Khong phai Tizen - bo qua loi nay */
    }

    /* 5. Bat dau fetch du lieu phim tu API NguonC */
    fetchAllMovies();

    /* Log cho developer */
    if (window.console && console.log) {
      console.log('CinemaX (ES5 / Smart TV Mode) da khoi dong!');
      console.log('Bat dau fetch ' + MY_FAVORITE_SLUGS.length + ' slug tu NguonC API...');
    }
  }

  /* Chay init khi DOM da san sang - tuong thich ca trinh duyet cu */
  if (document.addEventListener) {
    document.addEventListener('DOMContentLoaded', init, false);
  } else if (document.attachEvent) {
    document.attachEvent('onreadystatechange', function() {
      if (document.readyState === 'complete') init();
    });
  } else {
    window.onload = init;
  }

</script>
